<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixel Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#222326;--card:#2e2f33;--ink:#f4f4f6;--mute:#9a9ca6;--yel:#f7c600;--cyan:#2ee6d6;--pink:#ff3d81}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Lato,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top))}
.logo{font:14px/1.3 'Press Start 2P',monospace;color:var(--yel);text-shadow:3px 3px 0 var(--pink);flex:none}
.search{margin-left:auto;width:min(320px,100%);background:transparent;border:2px solid var(--ink);border-radius:999px;color:var(--ink);padding:9px 18px;font:inherit}
.search::placeholder{color:var(--mute)}
nav{background:#000;display:flex;gap:6px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
nav button{background:none;border:0;padding:15px 16px;font-weight:700;white-space:nowrap;border-bottom:3px solid transparent}
nav button[aria-pressed="true"]{border-color:var(--yel);color:var(--yel)}
main{max-width:1320px;margin:0 auto;padding:10px 20px 40px}
h2{font-size:20px;font-weight:900;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.row .tile{flex:none;width:110px}
.tile{position:relative;display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;background:hsl(var(--h) 45% 32%)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.35) 45%,transparent 70%);opacity:0;transition:opacity .2s}
.name{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:10px;text-align:center;font-weight:700;font-size:14px;line-height:1.25;opacity:0;transition:opacity .2s}
.tile:hover::after,.tile:hover .name,.tile:focus-visible::after,.tile:focus-visible .name{opacity:1}
.tile.noimg .name{opacity:1}
@media(hover:none){.tile::after,.name{opacity:1}}
.badge{position:absolute;top:0;right:0;z-index:3;font-style:normal;font-weight:900;font-size:11px;padding:2px 10px;border-radius:0 12px 0 12px;color:#1a1a1a;background:var(--yel)}
.badge.new{background:#3aa7ff;color:#fff}
.badge.original{background:var(--pink);color:#fff}
.frame{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px 12px 0 0;overflow:hidden;max-height:72vh;margin:0 auto}
.frame iframe{width:100%;height:100%;border:0;display:block}
.frame canvas{width:100%;height:100%;display:block;touch-action:none;background:#0d0820}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:hsl(var(--h) 45% 25%)}
.cover .thumb{width:150px;height:150px;border-radius:16px;overflow:hidden;background:hsl(var(--h) 45% 32%);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.cover .thumb img{width:100%;height:100%;object-fit:cover}
.play{background:var(--yel);color:#1a1a1a;border:0;border-radius:10px;font-weight:900;font-size:20px;padding:16px 36px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);padding:12px 16px;border-radius:0 0 12px 12px}
.bar h1{margin:0;font-size:24px;font-weight:900;margin-right:auto}
.bar button{background:#1b1c1f;border:0;border-radius:8px;padding:9px 14px;font-weight:700}
.back{display:inline-block;margin:14px 0;color:var(--cyan);font-weight:700}
.info{color:var(--mute);margin:14px 0 0}
.empty{background:var(--card);border-radius:12px;padding:24px;margin-top:26px}
.empty code{color:var(--yel)}
</style>
</head>
<body>
<header>
  <a class="logo" href="#" id="home">PIXEL ARCADE</a>
  <input class="search" id="q" type="search" placeholder="Search game..." aria-label="Search games">
</header>
<nav id="nav" aria-label="Categories"></nav>
<main id="app"></main>

<script>
(()=>{
/* ==========================================================================
   HOW TO ADD A GAME
   1. Copy one TEMPLATE line below into the GAMES list (remove the // at the start).
   2. Change slug (no spaces), name, tag, cat, and img.
   3. Put the thumbnail in an "img" folder next to index.html (square images work best).
   tag: 'new' | 'trending' | 'original' | '' (nothing)
   cat: clicker | io | adventure | 2-player | shooting | sports | car | puzzle | casual
   The row a game appears in depends on its tag: New games, Trending games, Originals.
   ========================================================================== */
const GAMES=[
  // TEMPLATE A - a game you build yourself (the code goes in ENGINES below, with the same name as engine):
  // {slug:'example',name:'Example Game',tag:'original',cat:'casual',img:'img/example.png',engine:'example',help:'Click the targets before time runs out.'},

  // TEMPLATE B - a game that lives on another page and is shown inside yours:
  // {slug:'my-iframe-game',name:'My Iframe Game',tag:'new',cat:'puzzle',img:'img/my-iframe-game.png',url:'https://example.com/game/',help:'Use the arrow keys.'},
];

/* ==========================================================================
   GAME ENGINE TEMPLATE
   Copy this block, rename 'example', then build your game inside it.
   You get:  canvas, ctx (2D drawing), W, H (640x360), text(str,x,y,size,color),
             getBest(), saveBest(score)
   Return a function that cleans up (stop the loop, remove listeners).
   ========================================================================== */
const ENGINES={};

ENGINES.example=({canvas,ctx,W,H,text,getBest,saveBest})=>{
  let score=0,time=20,t={x:320,y:180},over=false,raf,last=performance.now();
  const click=e=>{
    const r=canvas.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;
    if(over){score=0;time=20;over=false;return}                       // restart
    if(Math.hypot(px-t.x,py-t.y)<28){score++;t={x:40+Math.random()*(W-80),y:60+Math.random()*(H-120)}}
  };
  canvas.addEventListener('pointerdown',click);
  // For keyboard games: addEventListener('keydown',onKey) here, removeEventListener in the cleanup below.
  const loop=now=>{
    const dt=(now-last)/1000;last=now;
    if(!over){time-=dt;if(time<=0){over=true;saveBest(score)}}       // update
    ctx.fillStyle='#0d0820';ctx.fillRect(0,0,W,H);                    // draw
    ctx.fillStyle='#ff3d81';ctx.beginPath();ctx.arc(t.x,t.y,24,0,7);ctx.fill();
    text('SCORE '+score,90,28,12,'#f7c600');
    text('TIME '+Math.max(0,Math.ceil(time)),W/2,28,12,'#2ee6d6');
    text('BEST '+Math.max(getBest(),score),W-100,28,12,'#f7c600');
    if(over){
      ctx.fillStyle='rgba(13,8,32,.8)';ctx.fillRect(0,0,W,H);
      text('GAME OVER',W/2,160,30,'#ff3d81');text('SCORE '+score,W/2,205,16,'#f7c600');text('CLICK TO RETRY',W/2,250,11,'#2ee6d6');
    }
    raf=requestAnimationFrame(loop);
  };
  raf=requestAnimationFrame(loop);
  return()=>{cancelAnimationFrame(raf);canvas.removeEventListener('pointerdown',click)};
};

/* ==========================================================================
   SITE CODE - you shouldn't need to change anything below this line
   ========================================================================== */
const CATS=[['clicker','Clicker'],['io','Io'],['adventure','Adventure'],['2-player','2 Player'],['shooting','Shooting'],['sports','Sports'],['car','Car'],['puzzle','Puzzle'],['casual','Casual']];
const games=GAMES.map(g=>{let h=0;for(const c of g.slug)h=(h*31+c.charCodeAt(0))%360;return{...g,h}});
const $=id=>document.getElementById(id),app=$('app');
let cat='',q='',stop=()=>{};

const getRec=()=>{try{return JSON.parse(localStorage.getItem('arcade-recent')||'[]')}catch(e){return[]}};
const addRec=s=>{try{localStorage.setItem('arcade-recent',JSON.stringify([s,...getRec().filter(x=>x!==s)].slice(0,8)))}catch(e){}};
const LABEL={new:'New',trending:'Trending',original:'Original'};

const tile=g=>`<a class="tile${g.img?'':' noimg'}" href="#${g.slug}" style="--h:${g.h}">${g.img?`<img loading="lazy" alt="" src="${g.img}">`:''}${g.tag?`<i class="badge ${g.tag}">${LABEL[g.tag]||g.tag}</i>`:''}<span class="name">${g.name}</span></a>`;
const sec=(t,l,row)=>l.length?`<h2>${t}</h2><div class="${row?'row':'grid'}">${l.map(tile).join('')}</div>`:'';

function nav(){$('nav').innerHTML=CATS.map(([k,n])=>`<button data-c="${k}" aria-pressed="${cat===k}">${n}</button>`).join('')}

function home(){
  document.title='Pixel Arcade';nav();
  if(!games.length){
    app.innerHTML='<div class="empty"><h2 style="margin-top:0">No games yet</h2><p>Open <code>index.html</code>, find the <code>GAMES</code> list, and copy a TEMPLATE line into it.</p></div>';
    return;
  }
  if(q||cat){
    const l=games.filter(g=>(!cat||g.cat===cat)&&g.name.toLowerCase().includes(q.toLowerCase()));
    const t=cat?CATS.find(c=>c[0]===cat)[1]+' games':'Results';
    app.innerHTML=l.length?sec(t,l):`<h2>${t}</h2><p class="info">No games found. Try another search.</p>`;
    return;
  }
  const rec=getRec().map(s=>games.find(g=>g.slug===s)).filter(Boolean);
  app.innerHTML=sec('Continue playing',rec,true)+sec('Originals',games.filter(g=>g.tag==='original'))+sec('New games',games.filter(g=>g.tag==='new'))+sec('Trending games',games.filter(g=>g.tag==='trending'))+sec('More games',games.filter(g=>!LABEL[g.tag]));
}

function mount(g){
  const fr=$('frame');
  if(g.url){fr.innerHTML=`<iframe src="${g.url}" title="${g.name}" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>`;return}
  const eng=ENGINES[g.engine];
  if(!eng){fr.innerHTML='<div class="cover"><p>No engine named "'+g.engine+'" was found.</p></div>';return}
  fr.innerHTML='<canvas id="cv" width="640" height="360"></canvas>';
  const cv=$('cv'),ctx=cv.getContext('2d');
  const text=(s,x,y,z,c)=>{ctx.font=z+'px "Press Start 2P",monospace';ctx.fillStyle=c;ctx.textAlign='center';ctx.fillText(s,x,y)};
  const key='best-'+g.slug;
  const getBest=()=>{try{return +localStorage.getItem(key)||0}catch(e){return 0}};
  const saveBest=s=>{if(s>getBest())try{localStorage.setItem(key,s)}catch(e){}};
  const cleanup=eng({canvas:cv,ctx,W:640,H:360,text,getBest,saveBest});
  stop=()=>{if(cleanup)cleanup();stop=()=>{}};
}

function player(g){
  document.title=g.name+' - Pixel Arcade';nav();
  const more=games.filter(x=>x.slug!==g.slug&&x.cat===g.cat).concat(games.filter(x=>x.cat!==g.cat)).slice(0,12);
  app.innerHTML=`<a class="back" href="#">&larr; All games</a>
  <div class="frame" id="frame" style="--h:${g.h}"><div class="cover"><div class="thumb">${g.img?`<img alt="" src="${g.img}">`:''}</div><button class="play" id="play">Play Now &#9658;</button></div></div>
  <div class="bar"><h1>${g.name}</h1><button id="fs">Fullscreen</button></div>
  ${g.help?`<p class="info">${g.help}</p>`:''}
  ${sec('You may also like',more)}`;
  $('play').onclick=()=>{addRec(g.slug);mount(g)};
  $('fs').onclick=()=>{const f=$('frame');(f.requestFullscreen||f.webkitRequestFullscreen||(()=>{})).call(f)};
  scrollTo(0,0);
}

function route(){stop();const g=games.find(x=>x.slug===location.hash.slice(1));g?player(g):home()}

$('nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  cat=cat===b.dataset.c?'':b.dataset.c;
  if(location.hash)location.hash='';else home();
});
$('q').addEventListener('input',e=>{q=e.target.value.trim();if(location.hash)location.hash='';else home()});
$('home').addEventListener('click',()=>{q='';cat='';$('q').value=''});
addEventListener('error',e=>{ // a thumbnail that fails to load falls back to a colored tile with the name
  const t=e.target;if(t.tagName!=='IMG')return;
  t.remove();const tl=t.closest&&t.closest('.tile');if(tl)tl.classList.add('noimg');
},true);
addEventListener('hashchange',route);
route();
})();
</script>
</body>
</html>
